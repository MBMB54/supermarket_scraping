version: 2

models:
  - name: dim_product_search
    description: "{{ doc('dim_product_search') }}"
    config:
      contract:
        enforced: true
    data_tests:
      - unique_combination:
          arguments:
            columns: [supermarket, id]
    columns:
      - name: product_key
        description: "{{ doc('search_product_key') }}"
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: supermarket
        description: "{{ doc('col_supermarket') }}"
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tesco','aldi','dunnes','supervalu']
      - name: id
        description: "{{ doc('col_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_product_listings')
                field: id
      - name: title
        description: "{{ doc('col_title') }}"
        data_type: varchar
      - name: title_cleaned
        description: "{{ doc('col_title_cleaned') }}"
        data_type: varchar
        data_tests:
          - not_null
      - name: brand
        description: "{{ doc('col_brand') }}"
        data_type: varchar
      - name: is_own_brand
        description: "{{ doc('col_is_own_brand') }}"
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: category_1
        description: "{{ doc('col_category_1') }}"
        data_type: varchar
      - name: category_2
        description: "{{ doc('col_category_2') }}"
        data_type: varchar
      - name: category_3
        description: "{{ doc('col_category_3') }}"
        data_type: varchar
      - name: category_4
        description: "{{ doc('col_category_4') }}"
        data_type: varchar
      - name: item_description
        description: "{{ doc('col_item_description') }}"
        data_type: varchar
      - name: ingredients
        description: "{{ doc('col_ingredients') }} NULL means unknown (Aldi has ingredients for about a quarter of its products), not none."
        data_type: varchar
      - name: contains_allergens
        description: "{{ doc('col_contains_allergens') }} NULL means unknown (Aldi has ingredients for about a quarter of its products), not none."
        data_type: varchar[]
      - name: may_contain_allergens
        description: "{{ doc('col_may_contain_allergens') }} NULL means unknown (Aldi has ingredients for about a quarter of its products), not none."
        data_type: varchar[]
      - name: dietary_flags
        description: "{{ doc('col_dietary_flags') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: varchar[]
      - name: is_vegan
        description: "{{ doc('col_is_vegan') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_vegetarian
        description: "{{ doc('col_is_vegetarian') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_gluten_free
        description: "{{ doc('col_is_gluten_free') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_organic
        description: "{{ doc('col_is_organic') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_low_fat
        description: "{{ doc('col_is_low_fat') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_kosher
        description: "{{ doc('col_is_kosher') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_halal
        description: "{{ doc('col_is_halal') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_dairy_free
        description: "{{ doc('col_is_dairy_free') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_sugar_free
        description: "{{ doc('col_is_sugar_free') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: has_no_added_sugar
        description: "{{ doc('col_has_no_added_sugar') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_diabetic_friendly
        description: "{{ doc('col_is_diabetic_friendly') }} NULL means unknown, not false: filter with IS TRUE."
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: price
        description: "{{ doc('col_price') }}"
        data_type: double
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
      - name: was_price
        description: "{{ doc('col_was_price') }}"
        data_type: double
      - name: is_discount
        description: "{{ doc('col_is_discount') }}"
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: is_promotion
        description: "{{ doc('col_is_promotion') }}"
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: unit_price
        description: "{{ doc('col_unit_price') }}"
        data_type: double
      - name: price_per_unit_normalised
        description: "{{ doc('col_price_per_unit_normalised') }}"
        data_type: double
      - name: unit_normalised
        description: "{{ doc('col_unit_normalised') }}"
        data_type: varchar
      - name: image_url
        description: "{{ doc('col_image_url') }}"
        data_type: varchar
      - name: is_product_available
        description: "{{ doc('col_is_product_available') }}"
        data_type: boolean
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: scraped_date
        description: "{{ doc('col_scraped_date') }}"
        data_type: date
