unit_tests:
  - name: int_embedding_current_keys_keeps_newest_ok_embedding_with_all_its_vectors
    description: >
      Per (spec, supermarket, id) only the successful rows with the newest embedded_at survive: a
      re-embedded title replaces the older vector, a later error row does not hide the last good
      vector, a multi-vector item keeps every vector of its newest embedding (and drops the older
      one whole), and the same id in another spec or retailer is independent.
    model: int_embedding_current_keys
    given:
      - input: ref('stg_embedding_parts')
        rows:
          # a1: re-embedded after a title change -> only the newer vector
          - {spec_id: s1, supermarket: tesco, id: a1, vector_index: 0, content_key: old, embedded_at: "2026-10-01 10:00:00", status: ok}
          - {spec_id: s1, supermarket: tesco, id: a1, vector_index: 0, content_key: new, embedded_at: "2026-10-05 10:00:00", status: ok}
          # a2: newest attempt failed -> the older ok vector stays current
          - {spec_id: s1, supermarket: tesco, id: a2, vector_index: 0, content_key: k2, embedded_at: "2026-10-01 10:00:00", status: ok}
          - {spec_id: s1, supermarket: tesco, id: a2, vector_index: 0, content_key: k2, embedded_at: "2026-10-06 10:00:00", status: error}
          # a3: multi-vector item, re-embedded with fewer vectors -> only the two newest vectors
          - {spec_id: s2, supermarket: aldi, id: a3, vector_index: 0, content_key: m1, embedded_at: "2026-10-01 10:00:00", status: ok}
          - {spec_id: s2, supermarket: aldi, id: a3, vector_index: 1, content_key: m1, embedded_at: "2026-10-01 10:00:00", status: ok}
          - {spec_id: s2, supermarket: aldi, id: a3, vector_index: 2, content_key: m1, embedded_at: "2026-10-01 10:00:00", status: ok}
          - {spec_id: s2, supermarket: aldi, id: a3, vector_index: 0, content_key: m2, embedded_at: "2026-10-07 10:00:00", status: ok}
          - {spec_id: s2, supermarket: aldi, id: a3, vector_index: 1, content_key: m2, embedded_at: "2026-10-07 10:00:00", status: ok}
          # same id in another retailer is a different product
          - {spec_id: s1, supermarket: aldi, id: a1, vector_index: 0, content_key: k3, embedded_at: "2026-10-02 10:00:00", status: ok}
          # only ever errored -> not in the output
          - {spec_id: s1, supermarket: dunnes, id: a4, vector_index: 0, content_key: k4, embedded_at: "2026-10-02 10:00:00", status: error}
    expect:
      rows:
        - {spec_id: s1, supermarket: tesco, id: a1, vector_index: 0, content_key: new, embedded_at: "2026-10-05 10:00:00"}
        - {spec_id: s1, supermarket: tesco, id: a2, vector_index: 0, content_key: k2, embedded_at: "2026-10-01 10:00:00"}
        - {spec_id: s2, supermarket: aldi, id: a3, vector_index: 0, content_key: m2, embedded_at: "2026-10-07 10:00:00"}
        - {spec_id: s2, supermarket: aldi, id: a3, vector_index: 1, content_key: m2, embedded_at: "2026-10-07 10:00:00"}
        - {spec_id: s1, supermarket: aldi, id: a1, vector_index: 0, content_key: k3, embedded_at: "2026-10-02 10:00:00"}
