version: 2

models:
  - name: int_tesco
    description: >
      Tesco products on the unified retailer schema: normalised text, price/was_price from price_cut promotions, unit normalisation, structured allergens and dietary flags from food icons and badges.
    config:
      contract:
        enforced: true
    data_tests:
      - min_row_count:
          arguments:
            min_rows: 5000
    columns:
      - name: id
        description: "{{ doc('col_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: supermarket
        description: "{{ doc('col_supermarket') }}"
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tesco','aldi','dunnes','supervalu']
      - name: title
        description: "{{ doc('col_title') }}"
        data_type: varchar
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: title_cleaned
        description: "{{ doc('col_title_cleaned') }}"
        data_type: varchar
      - name: brand
        description: "{{ doc('col_brand') }}"
        data_type: varchar
      - name: is_own_brand
        description: "{{ doc('col_is_own_brand') }}"
        data_type: boolean
      - name: item_description
        description: "{{ doc('col_item_description') }}"
        data_type: varchar
      - name: category_1
        description: "{{ doc('col_category_1') }}"
        data_type: varchar
      - name: category_2
        description: "{{ doc('col_category_2') }}"
        data_type: varchar
      - name: category_3
        description: "{{ doc('col_category_3') }}"
        data_type: varchar
      - name: category_4
        description: "{{ doc('col_category_4') }}"
        data_type: varchar
      - name: is_discount
        description: "{{ doc('col_is_discount') }}"
        data_type: boolean
      - name: is_promotion
        description: "{{ doc('col_is_promotion') }}"
        data_type: boolean
      - name: price
        description: "{{ doc('col_price') }}"
        data_type: double
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
      - name: was_price
        description: "{{ doc('col_was_price') }}"
        data_type: double
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
      - name: selling_size
        description: "{{ doc('col_selling_size') }}"
        data_type: double
      - name: unit
        description: "{{ doc('col_unit') }}"
        data_type: varchar
      - name: unit_qty_normalised
        description: "{{ doc('col_unit_qty_normalised') }}"
        data_type: double
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: unit_normalised
        description: "{{ doc('col_unit_normalised') }}"
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ['kg','l','m','each']
              config:
                severity: warn
      - name: unit_price
        description: "{{ doc('col_unit_price') }}"
        data_type: double
      - name: price_per_unit_normalised
        description: "{{ doc('col_price_per_unit_normalised') }}"
        data_type: double
      - name: promotion_description
        description: "{{ doc('col_promotion_description') }}"
        data_type: varchar
      - name: promotion_type
        description: "{{ doc('col_promotion_type') }}"
        data_type: varchar
      - name: promotion_qualities
        description: "{{ doc('col_promotion_qualities') }}"
