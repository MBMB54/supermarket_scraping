name: 'dbt_ie_supermarket_analytics'
version: '1.0.0'
profile: 'dbt_ie_supermarket_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # run_date (YYYY-MM-DD) selects the raw partition; pass it via --vars. When omitted the sources
  # fall back to today's UTC date (see models/staging/raw_s3.yml).
  # S3 prefix (or local dir) that dbt WRITES Parquet outputs to: today only
  # int_all_supermarket_products -> {prefix}/all_supermarket_products.parquet, which
  # ml/embeddings.py reads (it hardcodes processed/all_supermarket_products.parquet, not this var).
  # Override with a local dir when testing so production S3 is not touched.
  parquet_output_prefix: "s3://ie-supermarket-data/processed"
  # Prefix dbt READS embeddings from ({prefix}/embeddings/{embedding_model}/...), written by ml/embeddings.py.
  embeddings_input_prefix: "s3://ie-supermarket-data/processed"

models:
  dbt_ie_supermarket_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

flags:
  require_generic_test_arguments_property: true
