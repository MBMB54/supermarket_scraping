# Draft: copy to .github/workflows/dbt-ci.yml. CI only (no AWS, no data): parses the project and
# runs the unit tests of the Batch helpers (local directories only). The daily build runs on AWS
# Batch, not here. dbt unit tests (test_type:unit) are not run: under dbt-core three of them differ
# from Fusion (fixture typing), so run them locally with `dbtf test --select test_type:unit`.
name: dbt-ci
on:
  pull_request:
    paths: ["dbt/**", "infra/dbt/**", "scraper_common/**", "tests/test_dbt_infra.py"]
jobs:
  parse-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r infra/dbt/requirements.txt pytest
      - run: dbt parse --project-dir dbt --profiles-dir infra/dbt --vars '{run_date: 2026-01-01}'
      - run: pytest tests/test_dbt_infra.py -q
