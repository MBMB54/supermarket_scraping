[project]
name = "supermarket-scraping"
version = "0.1.0"
description = "Supermarket web scraping project"
requires-python = ">=3.11"  # Change this from >=3.9
dependencies = [
    "beautifulsoup4>=4.12.2",
    "pandas>=2.1.3",
    "pyarrow>=18.1.0",
    "requests>=2.32.3",
    "boto3",
    "selenium>=4.15.2",
    "undetected-chromedriver>=3.5.5",
    "lxml>=6.0.2",
    "ruff>=0.14.13",
]


[tool.ruff]
# Set line length
line-length = 100

# Target Python version
target-version = "py311"

# Enable these rule sets
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

# Ignore specific rules if needed
lint.ignore = [
    "E501",  # Line too long (handled by formatter)
]

# Exclude directories
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
